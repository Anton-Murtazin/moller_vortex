[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moller-vortex"
version = "0.2.0"
description = "Quadrature calculation of Moller scattering for covariant vortex packets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
notebook = ["ipykernel>=6", "matplotlib>=3.7", "tqdm>=4.66"]

[tool.setuptools.packages.find]
where = ["src"]
